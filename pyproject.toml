    "numpy==2.5.1",
    "pyfiglet>=1.0.4",
    "scipy>=1.18.0",
    "tesseract-core[runtime] @ git+https://github.com/dazhizhao/tesseract-core.git@43fe09bd8ef1a96569e8499d022482d1ae4ce1de",
    "tesseract-torch>=0.1.0",
    "torch>=2.13.0",
]
